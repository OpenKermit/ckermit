[pytest]
addopts = -n auto
# Backstop against a hung test (e.g. a subprocess call with a missing
# or ineffective timeout) stalling the whole run with no indication of
# which test is stuck.  It is longer than the hang limits inside a test
# (see HANG_LIMIT_MIN in tests/conftest.py), so those fire first.
# The thread method bounds setup, call, and teardown together.  On
# expiry it ends the process, and xdist reports the test that was
# running.  tests/conftest.py writes a stall report to stderr shortly
# before that.
timeout = 600
timeout_method = thread

# A default run deselects tests with these markers, to spare
# integrators on slow or less common platforms.  --full or
# KERMIT_TEST_FULL=1 runs them.  CI and agents always pass --full.
# See tests/README.txt.
markers =
    slow: waits out a timeout or delay on purpose
    zmodem: runs a ZMODEM transfer with lrzsz
    faultinj: preloads tests/faultinj.c into wermit

# Configure logging capture format (shown on test failure)
log_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_date_format = %Y-%m-%d %H:%M:%S.%f

# Configure live logging (when --log-cli-level is set)
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S.%f
